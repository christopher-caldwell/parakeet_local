[package]
name = "parakeet-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
performance = ["gpui/profiler"]

[dependencies]
parakeet-domain.workspace = true
parakeet-application.workspace = true
parakeet-database.workspace = true
parakeet-infrastructure.workspace = true
tokio.workspace = true
serde_json.workspace = true
anyhow = "1"
chrono.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["font-kit", "runtime_shaders"] }
gpui-base = "=0.8.0"
